# Φτιάχνει το πακέτο για Windows 7 και το ανεβάζει στα Releases του GitHub,
# ώστε να κατεβαίνει από οποιοδήποτε κινητό ή PC: github.com/Michael-Gkotsis/grafeio-ilis/releases/latest
name: Πακέτο Windows 7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paketo
  cancel-in-progress: true

jobs:
  paketo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Κάθε πακέτο παίρνει δικό του αριθμό (0.1.<αριθμός run>), ώστε το zip να έχει άλλο όνομα από το προηγούμενο
      # και να μη μπερδεύεται με παλιό κατέβασμα· ο αριθμός φαίνεται και μέσα στην εφαρμογή
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package:win -- x64
      - run: npm run package:win -- ia32
      - name: Ανέβασμα στα Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          ZIP64="release/GrafeioIlis-win7-x64-$V.zip"
          ZIP32="release/GrafeioIlis-win7-ia32-$V.zip"
          NOTES="Γραφείο Λοχία $V για Windows 7, από το commit ${GITHUB_SHA::7}. Δύο zip: GrafeioIlis-win7-x64-$V.zip για 64-bit και GrafeioIlis-win7-ia32-$V.zip για 32-bit (Windows 32-bit ή δοκιμή σε παλιό PC). Η έκδοση φαίνεται μέσα στην εφαρμογή, αν περάσεις το ποντίκι πάνω από το «Γραφείο Λοχία». Κατέβασε το zip, βάλ' το σε USB, αποσυμπίεσέ το στο PC του γραφείου και άνοιξε το GrafeioIlis.exe."
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$ZIP64" "$ZIP32" --clobber
            gh release edit "v$V" --notes "$NOTES"
          else
            gh release create "v$V" "$ZIP64" "$ZIP32" --target "$GITHUB_SHA" --title "Γραφείο Λοχία $V (Windows 7)" --notes "$NOTES"
          fi
