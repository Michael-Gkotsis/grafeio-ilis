<div class="strength-page">
  <div class="page-head">
    <div>
      <h1>
        Δύναμη
      </h1>
      <p class="page-head__sub">
        Δευτέρα 09/11/2026 στις 11:00 · όποιος γύρισε ως τώρα είναι παρών
      </p>
    </div>
    <div class="page-head__acts">
      <div class="strip datebar" role="group" aria-label="Ημερομηνία">
        <button type="button" class="daybtn" aria-pressed="true">
          <span class="daybtn__d">
            Δευ σήμερα
          </span>
          <span class="daybtn__n">
            09/11
          </span>
        </button>
        <button type="button" class="daybtn" aria-pressed="false">
          <span class="daybtn__d">
            Τρί αύριο
          </span>
          <span class="daybtn__n">
            10/11
          </span>
        </button>
        <input aria-label="Άλλη ημερομηνία" class="ui-input datebar__pick" inputMode="numeric" placeholder="ηη/μμ/εεεε" autoComplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" value="09/11/2026"/>
        <input type="date" class="datefld__cal" tabindex="-1" aria-hidden="true" value="2026-11-09"/>
      </div>
      <button type="button" class="ui-btn ui-btn--outline ui-btn--sm" data-tip="Υπηρεσία εκτός δικών μας, π.χ. ΣΤΕΠ">
        + Κωλυόμενος
      </button>
      <button type="button" class="ui-btn ui-btn--link ui-btn--sm">
        ΗΚΑΙ
      </button>
    </div>
  </div>
  <div class="ui-kpis ui-kpis--check">
    <button type="button" class="ui-kpi" aria-pressed="false" data-tip="Στρατιώτες σε δύναμη. Η ΗΚΑΙ μετρά και τα στελέχη. Πάτα για να δεις όλους">
      <span class="ui-kpi__l">
        Δύναμη
      </span>
      <span class="ui-kpi__n">
        12
      </span>
    </button>
    <button type="button" class="ui-kpi ui-kpi--ok" aria-pressed="false" data-tip="Παρόντες που δεν είναι κωλυόμενοι. Μέσα και όσοι έχουν δική μας υπηρεσία, ΕΥ, ποινή ή ιατρικό">
      <span class="ui-kpi__l">
        Παρόντες
      </span>
      <span class="ui-kpi__n">
        9
      </span>
    </button>
    <button type="button" class="ui-kpi" aria-pressed="true" data-tip="Δηλωμένοι κωλυόμενοι (π.χ. υπηρεσία ΣΤΕΠ) και εισαγωγές ΣΤΕΠ, που αφαιρούνται από τους παρόντες">
      <span class="ui-kpi__l">
        Κωλυόμενοι
      </span>
      <span class="ui-kpi__n">
        0
      </span>
    </button>
    <button type="button" class="ui-kpi" aria-pressed="false" data-tip="Άδειες, νοσοκομείο, έξοδος και ΔΝ· κάθε άτομο μία φορά">
      <span class="ui-kpi__l">
        Απόντες
      </span>
      <span class="ui-kpi__n">
        3
      </span>
    </button>
    <div class="ui-kpis__check">
      <span class="ui-kpi__l">
        Έλεγχος
      </span>
      <span class="ui-kpis__sum num">
        <b>
          9
        </b>
         + 
        <b>
          0
        </b>
         + 
        <b>
          3
        </b>
         = 
        <b>
          12
        </b>
         
        <span class="ui-kpis__ok" role="img" aria-label="βγαίνει">
          ✓
        </span>
      </span>
    </div>
  </div>
  <div class="strength__bar">
    <input type="search" class="ui-input strength__search" aria-label="Αναζήτηση" placeholder="Επώνυμο ή όνομα (χωρίς τόνους)" value=""/>
    <div class="strip strength__seg" role="group" aria-label="Ουλαμός">
      <button type="button" class="strength__segbtn" aria-pressed="true">
        Όλοι
      </button>
      <button type="button" class="strength__segbtn" aria-pressed="false">
        1ος Ουλ.
      </button>
      <button type="button" class="strength__segbtn" aria-pressed="false">
        2ος Ουλ.
      </button>
    </div>
    <span class="actfilter" role="status">
      Φίλτρο: 
      <b>
        Κωλυόμενοι
      </b>
      <button type="button" aria-label="Καθάρισε το φίλτρο" data-tip="Καθάρισε το φίλτρο">
        ✕
      </button>
    </span>
    <button type="button" class="strength__how-btn" aria-expanded="false" aria-controls="strength-how">
      Πώς μετράει;
    </button>
  </div>
  <div class="strength__groups">
    <div class="strength__cell strength__cell--kol">
      <section class="ui-card ui-card--fold">
        <div class="ui-card__head">
          <h2>
            <button type="button" class="ui-card__toggle" aria-expanded="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="16" height="16">
                <path d="M9 6l6 6-6 6"/>
              </svg>
              <span>
                Κωλυόμενοι · 0
              </span>
            </button>
          </h2>
        </div>
        <div class="ui-card__body">
          <div class="empty">
            Κανείς.
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<div class="ui-toasts" aria-live="polite">
</div>
